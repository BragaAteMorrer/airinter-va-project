<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3615 AIRINTER — M0</title>
  <link rel="stylesheet" href="./minitel-runtime.css">
  <style>
    html,body{height:100%;margin:0;background:#050505}
    #terminal{height:100%}
    #fallback{display:none;min-height:100%;place-items:center;padding:24px;background:#f7fafc;font:16px system-ui;color:#102c42}
    #fallback div{max-width:520px;text-align:center}
    #fallback button{padding:12px 18px}
  </style>
</head>
<body>
  <main id="terminal"></main>
  <section id="fallback" aria-live="polite">
    <div>
      <h1>Mode Minitel indisponible</h1>
      <p>Cette interface nécessite un ordinateur avec clavier et pointeur précis.</p>
      <button type="button" id="exit">Revenir au mode moderne</button>
    </div>
  </section>

  <script src="./runtime.js"></script>
  <script src="./renderer.js"></script>
  <script>
    (() => {
      const mt = window.AirInterMinitel;
      const capability = mt.minitelCapability(window);
      if (!capability.allowed) {
        document.getElementById('terminal').hidden = true;
        document.getElementById('fallback').style.display = 'grid';
        document.getElementById('exit').addEventListener('click', () => history.back());
        return;
      }

      const home = new mt.MinitelPage('home', {
        onRender: (_context, screen, session) => {
          screen.write(0, 0, '3615 AIRINTER', { foreground: 'cyan' });
          screen.write(3, 10, 'AIR INTER', { foreground: 'yellow' });
          screen.write(5, 4, 'TERMINAL M0 / RUNTIME TEST');
          screen.write(8, 4, '1  TABLEAU DES VOLS', { foreground: 'cyan' });
          screen.write(9, 4, '2  AIDE CLAVIER', { foreground: 'cyan' });
          screen.write(17, 4, 'VOTRE CHOIX : ' + session.input.value, { foreground: 'yellow' });
          screen.write(23, 0, 'GUIDE SOMMAIRE RETOUR SUITE      ENVOI', { foreground: 'cyan' });
        },
        send: (value) => value === '1' ? 'flights' : value === '2' ? 'guide' : null,
        guide: () => 'guide'
      });

      const flights = new mt.MinitelPage('flights', {
        onRender: (_context, screen) => {
          screen.write(0, 0, '3615 AIRINTER / VOLS', { foreground: 'cyan' });
          screen.write(3, 1, 'VOL     DEST.       DEP     ETAT', { foreground: 'yellow' });
          screen.write(4, 1, '--------------------------------------');
          screen.write(6, 1, 'ITF049  VICHY       14:35   EMBARQ.');
          screen.write(7, 1, 'ITF749  ROME        14:45   A L HEURE');
          screen.write(8, 1, 'ITF870  NICE        15:05   RETARDE', { foreground: 'red' });
          screen.write(22, 1, 'RETOUR: PAGE PRECEDENTE');
          screen.write(23, 0, 'GUIDE SOMMAIRE RETOUR SUITE      ENVOI', { foreground: 'cyan' });
        },
        guide: () => 'guide'
      });

      const guide = new mt.MinitelPage('guide', {
        onRender: (_context, screen) => {
          screen.write(0, 0, '3615 AIRINTER / GUIDE', { foreground: 'cyan' });
          screen.write(3, 1, 'ENTER      ENVOI');
          screen.write(4, 1, 'BACKSPACE  CORRECTION');
          screen.write(5, 1, 'ESC        ANNULATION');
          screen.write(6, 1, 'HOME       SOMMAIRE');
          screen.write(7, 1, 'F1         GUIDE');
          screen.write(8, 1, 'F2         REPETITION');
          screen.write(9, 1, 'PAGE UP    RETOUR');
          screen.write(10, 1, 'PAGE DOWN  SUITE');
          screen.write(11, 1, 'F10        CONNEXION/FIN');
          screen.write(22, 1, 'RETOUR: PAGE PRECEDENTE');
        }
      });

      const session = new mt.MinitelSession({ homePageId: 'home', speed: 'fast' });
      session.register(home).register(flights).register(guide);
      const renderer = new mt.MinitelDomRenderer(document.getElementById('terminal'), { speed: 'fast' });
      const keyboard = new mt.MinitelKeyboardController(session, renderer).attach();
      renderer.render(session.start(), { replay: true });
      renderer.showCursor(17, 18, true);
      window.addEventListener('beforeunload', () => keyboard.detach(), { once: true });
    })();
  </script>
</body>
</html>
