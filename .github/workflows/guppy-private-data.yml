name: GuppY private data guard

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  prevent-private-data-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject newly tracked private GuppY runtime files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "::error::Missing base revision; refusing to skip audit."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          else
            base="$BASE_SHA"
          fi
          violation=0
          while IFS= read -r -d '' path; do
            case "$path" in
              public_html/save/*)
                echo "::error file=$path::Private GuppY data must not be added"
                violation=1
                ;;
              public_html/data/config/*|public_html/data/dbdocs/*|public_html/data/error/*|public_html/data/security/*|public_html/data/stats/*|public_html/data/tmp/*|public_html/data/users/*)
                if [[ "$path" != */.htaccess ]]; then
                  echo "::error file=$path::Private GuppY data must not be added"
                  violation=1
                fi
                ;;
            esac
          done < <(git diff --name-only --diff-filter=A -z "$base" "$HEAD_SHA")
          if (( violation )); then
            exit 1
          fi
          echo "No newly added GuppY private runtime files."
