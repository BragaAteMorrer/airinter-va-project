name: GuppY private data guard

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  prevent-private-data-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject newly tracked private GuppY runtime files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "::error::Cannot determine diff base; refusing to skip private-data audit."
            exit 1
          fi
          # PRs use a merge-base; push events use their exact previous revision.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          else
            base="$BASE_SHA"
          fi
          additions="$(git diff --name-only --diff-filter=A -z "$base" "$HEAD_SHA" | python3 -c '
import sys
paths = (p.decode("utf-8", "surrogateescape") for p in sys.stdin.buffer.read().split(bytes([0])) if p)
private = ("config", "dbdocs", "error", "security", "stats", "tmp", "users")
for p in paths:
    bits = p.split("/")
    if len(bits) >= 3 and bits[:2] == ["public_html", "save"]:
        print(p)
    elif len(bits) >= 4 and bits[:2] == ["public_html", "data"] and bits[2] in private and bits[-1] != ".htaccess":
        print(p)
' )"
          if [[ -n "$additions" ]]; then
            echo "::error::New GuppY runtime data must never be committed:"
            printf '%s\n' "$additions"
            exit 1
          fi
          echo "No newly added GuppY private runtime files."
