name: Argos Lock Generator

on:
  push:
    branches:
      - feature/argos-lot-5-passkeys-risk

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airinter-id
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/argos-lot-5-passkeys-risk

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Update passkeys dependency
        run: composer update laravel/passkeys --with-all-dependencies --no-scripts --no-interaction

      - name: Validate generated lock
        run: composer validate --strict --no-check-publish

      - name: Commit generated lock
        working-directory: .
        run: |
          if git diff --quiet -- airinter-id/composer.lock; then
            echo "composer.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add airinter-id/composer.lock
          git commit -m "chore(argos): lock passkeys dependencies"
          git push origin HEAD:feature/argos-lot-5-passkeys-risk
