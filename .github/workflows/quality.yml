          for file in resources/lang/*/promethee.php resources/lang/*/promethee_briefing.php; do php -l "$file"; done


  promethee-hermes-lifecycle:
    name: Promethee Hermès lifecycle tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promethee
    env:
      APP_ENV: testing
      DB_CONNECTION: memory
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          extensions: json, mbstring, simplexml, bcmath, pdo, pdo_sqlite, intl, zip
      - name: Install Promethee dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run Hermès operation lifecycle regression suite
        run: vendor/bin/phpunit tests/HermesOperationLifecycleTest.php
      - name: Run Hermès scoring configuration tests
        run: vendor/bin/phpunit tests/LegacyPirepScoringConfigurationTest.php
      - name: Run sb-airframe historical configuration tests
        run: vendor/bin/phpunit tests/AircraftConfigurationResolverTest.php
      - name: Run airframe maintenance and fleet rotation tests
        run: vendor/bin/phpunit tests/PrometheeAirframeMaintenanceTest.php

  minitel-release-gate:
    name: Minitel M7 release gate
    runs-on: ubuntu-latest
    needs:
      - repository-hygiene
      - hermes
      - promethee
      - promethee-hermes-lifecycle
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run M7 acceptance gate
        run: |
          node --check promethee/tools/check_minitel_release.cjs
          node promethee/tools/check_minitel_release.cjs --report-dir TestResults/minitel-m7
      - name: Upload M7 acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minitel-m7-release-report
          path: TestResults/minitel-m7/
          if-no-files-found: error
