name: Quality

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject generated and hosting files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '^(acars|acars\.tests)/(bin|obj)/|^(logs|mail|etc|\.cpanel|\.caldav)/|^\.bash_history$|Zone\.Identifier$|\.(sql|sqlite|sqlite3|bak|backup)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden tracked files:"
            echo "$forbidden"
            exit 1
          fi
      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI -- ':!*.example' ':!*.md' '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})'; then
            echo "Potential secret material found in tracked files."
            exit 1
          fi
      - name: Validate Hermes interface JavaScript
        run: |
          node --check acars/wwwroot/i18n.js
          node --check acars/wwwroot/hermes-map.js
          node --check acars/wwwroot/hermes-review.js
          node --check acars/wwwroot/app.js
          node --check acars/msfs2024-efb/HermesEfb/build.js
          node -e "JSON.parse(require('fs').readFileSync('acars/msfs2024-efb/HermesEfb/package.json','utf8')); JSON.parse(require('fs').readFileSync('acars/msfs2024-efb/HermesEfb/tsconfig.json','utf8'));"
          node --check promethee/public/promethee-assets/promethee.js
          node --check promethee/public/promethee-assets/navigation-groups.js
          node promethee/tools/check_hermes_i18n.cjs
      - name: Validate Minitel M0 runtime
        run: |
          node --check promethee/shared/minitel/runtime.js
          node --check promethee/shared/minitel/renderer.js
          node --check promethee/shared/minitel/shell.js
          node --check promethee/public/promethee-assets/promethee-minitel.js
          node --check promethee/public/promethee-assets/login.js
          node --check acars/wwwroot/hermes-minitel-core.js
          node --check acars/wwwroot/hermes-minitel.js
          node promethee/shared/minitel/runtime.test.cjs
          node promethee/shared/minitel/shell.test.cjs
          node promethee/tools/check_minitel_renderer.test.cjs
          node promethee/tools/check_hermes_minitel.test.cjs
          node promethee/tools/check_minitel_assets.cjs
      - name: Validate upstream maintenance tooling
        run: |
          python -m py_compile promethee/tools/phpvms_upstream_audit.py
          python promethee/tools/phpvms_upstream_audit.py --check-manifest
      - name: Validate frontend performance and accessibility budgets
        run: |
          node --check promethee/tools/check_frontend_quality.cjs
          node promethee/tools/check_frontend_quality.cjs
      - name: Guard Air Inter-only Hermès authentication
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git grep -nEI '(ConfigureApiKey|X-API-Key|Connexion avancée|/api/config)' -- acars || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Legacy generic authentication must not return to Hermès:"
            echo "$forbidden"
            exit 1
          fi

  hermes:
    name: Hermes tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Windows launcher syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'start-acars.ps1'),
            [ref] $tokens,
            [ref] $parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validate Hermès release PowerShell syntax
        shell: pwsh
        run: |
          $scripts = @(
            'acars/build-installer.ps1',
            'acars/build-public-release.ps1',
            'acars/msfs2024-efb/build-efb-app.ps1',
            'acars/msfs2024-efb/build-efb-package.ps1',
            'acars/msfs2024-efb/install-efb-package.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref] $tokens,
              [ref] $parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$script : $($_.Message)" }
              exit 1
            }
          }

      - name: Test MSFS 2024 EFB Community package installer
        shell: pwsh
        run: |
          $fakeDist = Join-Path $env:RUNNER_TEMP 'hermes-efb-dist'
          $fakePackages = Join-Path $env:RUNNER_TEMP 'msfs2024-packages'
          $stateFile = Join-Path $env:RUNNER_TEMP 'hermes-efb-install.txt'
          New-Item -ItemType Directory -Force -Path (Join-Path $fakeDist 'Assets') | Out-Null
          Set-Content -LiteralPath (Join-Path $fakeDist 'HermesEfb.js') -Value '/* CI fixture */' -Encoding utf8
          Set-Content -LiteralPath (Join-Path $fakeDist 'HermesEfb.css') -Value '/* CI fixture */' -Encoding utf8
          Set-Content -LiteralPath (Join-Path $fakeDist 'Assets\hermes-efb.svg') -Value '<svg xmlns="http://www.w3.org/2000/svg"/>' -Encoding utf8
          New-Item -ItemType Directory -Force -Path $fakePackages | Out-Null

          ./acars/msfs2024-efb/build-efb-package.ps1 `
            -Version '9.9.9' `
            -SkipAppBuild `
            -EfbDistPath $fakeDist

          $package = Join-Path $PWD 'dist\AirInter-Hermes-EFB-MSFS2024-9.9.9\airinter-hermes-efb'
          if (-not (Test-Path (Join-Path $package 'manifest.json'))) { throw 'manifest.json missing' }
          if (-not (Test-Path (Join-Path $package 'layout.json'))) { throw 'layout.json missing' }
          $manifest = Get-Content (Join-Path $package 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.title -ne 'Air Inter Hermès EFB') { throw 'unexpected EFB manifest title' }

          ./acars/msfs2024-efb/install-efb-package.ps1 `
            -PackageSource $package `
            -InstalledPackagesPath $fakePackages `
            -StateFile $stateFile

          $installed = Join-Path $fakePackages 'Community2024\airinter-hermes-efb'
          if (-not (Test-Path (Join-Path $installed 'html_ui\efb_ui\efb_apps\AirInterHermes\HermesEfb.js'))) {
            throw 'EFB package was not installed in Community2024'
          }

          ./acars/msfs2024-efb/install-efb-package.ps1 -Uninstall -StateFile $stateFile
          if (Test-Path $installed) { throw 'EFB package was not removed by uninstall' }

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore tests
        run: dotnet restore acars.tests/Promethee.Acars.Tests.csproj
      - name: Restore Windows desktop
        run: dotnet restore acars/Promethee.Acars.csproj
      - name: Build Windows desktop
        run: dotnet build acars/Promethee.Acars.csproj --configuration Release --no-restore --framework net8.0-windows
      - name: Reset Hermès test state
        shell: pwsh
        run: |
          $state = Join-Path $env:LOCALAPPDATA 'AirInter\Promethee'
          if (Test-Path $state) { Remove-Item -Recurse -Force $state -ErrorAction Stop }
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          Write-Host "Hermes test state reset: $state"
      - name: Test
        run: dotnet test acars.tests/Promethee.Acars.Tests.csproj --configuration Release --no-restore --framework net8.0 --logger "trx;LogFileName=hermes-tests.trx" --results-directory TestResults
      - name: Upload Hermès test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-test-results
          path: TestResults/hermes-tests.trx
          if-no-files-found: warn

  promethee:
    name: Promethee manifest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promethee
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          extensions: json, mbstring, simplexml, bcmath, pdo, intl, zip
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Validate Promethee PHP syntax
        shell: bash
        run: |
          php -l modules/Promethee/Http/PortalController.php
          php -l modules/Promethee/Http/AutomationController.php
          php -l modules/Promethee/Services/EngineMaintenanceService.php
          php -l modules/Promethee/Services/FleetRotationService.php
          php -l modules/Promethee/Listeners/EngineMaintenanceEventListener.php
          php -l modules/Promethee/Console/RotateFleetCommand.php
