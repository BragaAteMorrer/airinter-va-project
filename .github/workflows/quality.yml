name: Quality

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject generated and hosting files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '^(acars|acars\.tests)/(bin|obj)/|^(logs|mail|etc|\.cpanel|\.caldav)/|^\.bash_history$|Zone\.Identifier$|\.(sql|sqlite|sqlite3|bak|backup)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden tracked files:"
            echo "$forbidden"
            exit 1
          fi
      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI -- ':!*.example' ':!*.md' '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})'; then
            echo "Potential secret material found in tracked files."
            exit 1
          fi
      - name: Validate Hermes interface JavaScript
        run: |
          node --check acars/wwwroot/i18n.js
          node --check acars/wwwroot/app.js
          node tools/check_hermes_i18n.cjs
      - name: Validate upstream maintenance tooling
        run: |
          python -m py_compile tools/phpvms_upstream_audit.py
          python tools/phpvms_upstream_audit.py --check-manifest
      - name: Guard Air Inter-only Hermès authentication
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git grep -nEI '(ConfigureApiKey|X-API-Key|Connexion avancée|/api/config)' -- acars || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Legacy generic authentication must not return to Hermès:"
            echo "$forbidden"
            exit 1
          fi

  hermes:
    name: Hermes tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Windows launcher syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'start-acars.ps1'),
            [ref] $tokens,
            [ref] $parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore tests
        run: dotnet restore acars.tests/Promethee.Acars.Tests.csproj
      - name: Restore Windows desktop
        run: dotnet restore acars/Promethee.Acars.csproj
      - name: Build Windows desktop
        run: dotnet build acars/Promethee.Acars.csproj --configuration Release --no-restore --framework net8.0-windows
      - name: Reset Hermès test state
        shell: pwsh
        run: |
          $state = Join-Path $env:LOCALAPPDATA 'AirInter\Promethee'
          if (Test-Path $state) { Remove-Item -Recurse -Force $state -ErrorAction Stop }
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          Write-Host "Hermes test state reset: $state"
      - name: Test
        run: dotnet test acars.tests/Promethee.Acars.Tests.csproj --configuration Release --no-restore --framework net8.0 --logger "trx;LogFileName=hermes-tests.trx" --results-directory TestResults
      - name: Upload Hermès test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-test-results
          path: TestResults/hermes-tests.trx
          if-no-files-found: warn

  promethee:
    name: Promethee manifest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prometheus
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          extensions: json, mbstring, simplexml, bcmath, pdo, intl, zip
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Validate Promethee PHP syntax
        shell: bash
        run: |
          php -l modules/Promethee/Http/PortalController.php
          php -l modules/Promethee/Http/AcarsOperationsController.php
          php -l modules/Promethee/Http/OperationsV1Controller.php
          php -l modules/Promethee/Http/TelemetryController.php
          php -l modules/Promethee/Http/DatalinkController.php
          php -l modules/Promethee/Services/DatalinkService.php
          php -l tests/DatalinkServiceTest.php
          php -l modules/Promethee/Http/SopController.php
          php -l modules/Promethee/Services/SopEngineService.php
          php -l tests/SopEngineServiceTest.php
          php -l modules/Promethee/Http/PresenceController.php
          php -l modules/Promethee/Services/PresenceService.php
          php -l tests/PresenceServiceTest.php
          php -l modules/Promethee/Services/OperationIdentityService.php
          php -l modules/Promethee/Services/SafetyAnalyzer.php
          php -l modules/Promethee/Services/AircraftOperationalStateService.php
          php -l modules/Promethee/Services/DemandProfileService.php
          php -l modules/Promethee/Services/AirInterCabinProfileService.php
          php -l modules/Promethee/Config/cabin-profiles.php
          php -l modules/Promethee/Services/EconomyFareResolver.php
          php -l modules/Promethee/Services/BbrReferenceRepairService.php
          php -l modules/Promethee/Database/migrations/2026_09_24_000013_repair_bbr_red_references.php
          php -l modules/Promethee/Database/migrations/2026_09_25_000014_repair_blank_bulk_bbr_references.php
          php -l modules/Promethee/Database/migrations/2026_09_25_000015_ensure_simbrief_api_key_setting.php
          php -l modules/Promethee/Database/migrations/2026_09_11_000000_create_acars_access_tokens_table.php
          php -l tests/PrometheeDemandEconomyTest.php
          php -l modules/Promethee/routes.php
          php -l app/Http/Controllers/Auth/RegisterController.php
          php -l tests/RegistrationTest.php
          php -l app/Notifications/Messages/AdminUserRegistered.php
          php -l app/Notifications/Messages/UserRejected.php
          php -l app/Notifications/Messages/UserRegistered.php
          php -l app/Notifications/Messages/UserPending.php
          php -l app/Notifications/Messages/PirepRejected.php
          php -l app/Notifications/Messages/PirepFiled.php
          php -l app/Notifications/Messages/PirepAccepted.php
          php -l app/Notifications/Messages/NewsAdded.php
          php -l app/Notifications/Messages/InviteLink.php
          php -l modules/Promethee/Providers/PrometheeServiceProvider.php
          php -l modules/Promethee/Listeners/ProgressionEventListener.php
          php -l modules/Promethee/Services/ProgressionService.php
          php -l modules/Promethee/Console/RecalculateProgressionCommand.php
          php -l modules/Promethee/Http/DispatchDeskController.php
          php -l modules/Promethee/Http/Api/AcarsSessionController.php
          php -l modules/Promethee/Http/Api/AcarsSimBriefController.php
          php -l app/Services/SimBriefService.php
          php -l modules/Promethee/Http/SimBriefCallbackController.php
          php -l modules/Promethee/Services/SimBriefApiSessionService.php
          php -l modules/Promethee/Services/SimBriefOperationResolver.php
          php -l tests/SimBriefApiSessionServiceTest.php
          php -l tests/SimBriefOperationResolverTest.php
          php -l tests/PrometheeSimBriefAdminTest.php
          php -l tests/DatabaseActivatorTest.php
          php -l tests/ModuleServiceCacheTest.php
          php -l tests/SimBriefTest.php
          php -l app/Http/Controllers/Admin/SettingsController.php
          php -l app/Models/Setting.php
          php -l app/Providers/RouteServiceProvider.php
          php -l modules/Promethee/Config/departure-board.php
          php -l modules/Promethee/Console/CheckPrometheeTranslations.php
          php -l modules/Promethee/Console/CheckTranslations.php
          for file in resources/lang/*/promethee.php resources/lang/*/promethee_briefing.php; do php -l "$file"; done
