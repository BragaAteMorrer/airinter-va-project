name: Quality

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject generated and hosting files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '^(acars|acars\.tests)/(bin|obj)/|^(logs|mail|etc|\.cpanel|\.caldav)/|^\.bash_history$|Zone\.Identifier$|\.(sql|sqlite|sqlite3|bak|backup)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden tracked files:"
            echo "$forbidden"
            exit 1
          fi
      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI -- ':!*.example' ':!*.md' '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})'; then
            echo "Potential secret material found in tracked files."
            exit 1
          fi
      - name: Validate Hermes interface JavaScript
        run: node --check acars/wwwroot/app.js
      - name: Guard Air Inter-only Hermès authentication
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git grep -nEI '(ConfigureApiKey|X-API-Key|Connexion avancée|/api/config)' -- acars || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Legacy generic authentication must not return to Hermès:"
            echo "$forbidden"
            exit 1
          fi

  hermes:
    name: Hermes tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Windows launcher syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'start-acars.ps1'),
            [ref] $tokens,
            [ref] $parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore tests
        run: dotnet restore acars.tests/Promethee.Acars.Tests.csproj
      - name: Restore Windows desktop
        run: dotnet restore acars/Promethee.Acars.csproj
      - name: Build Windows desktop
        run: dotnet build acars/Promethee.Acars.csproj --configuration Release --no-restore --framework net8.0-windows
      - name: Reset Hermès test state
        shell: pwsh
        run: |
          $state = Join-Path $env:LOCALAPPDATA 'AirInter\Promethee'
          if (Test-Path $state) { Remove-Item -Recurse -Force $state -ErrorAction Stop }
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          Write-Host "Hermes test state reset: $state"
      - name: Test
        run: dotnet test acars.tests/Promethee.Acars.Tests.csproj --configuration Release --no-restore --framework net8.0 --logger "trx;LogFileName=hermes-tests.trx" --results-directory TestResults
      - name: Upload Hermès test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-test-results
          path: TestResults/hermes-tests.trx
          if-no-files-found: warn

  promethee:
    name: Promethee manifest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prometheus
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          extensions: json, mbstring, simplexml, bcmath, pdo, intl, zip
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Validate Promethee PHP syntax
        shell: bash
        run: |
          php -l modules/Promethee/Http/PortalController.php
          php -l modules/Promethee/Http/AcarsOperationsController.php
          php -l modules/Promethee/Http/OperationsV1Controller.php
          php -l modules/Promethee/Http/TelemetryController.php
          php -l modules/Promethee/Services/OperationIdentityService.php
          php -l modules/Promethee/Services/SafetyAnalyzer.php
          php -l modules/Promethee/Services/AircraftOperationalStateService.php
          php -l modules/Promethee/routes.php
          php -l app/Http/Controllers/Api/AcarsSessionController.php
          php -l app/Http/Controllers/Api/AcarsSimBriefController.php
          php -l app/Http/Controllers/Admin/SettingsController.php
          php -l app/Providers/RouteServiceProvider.php
          php -l modules/Promethee/Config/departure-board.php
          php -l app/Console/Commands/CheckPrometheeTranslations.php
          for file in resources/lang/*/promethee_briefing.php; do php -l "$file"; done
