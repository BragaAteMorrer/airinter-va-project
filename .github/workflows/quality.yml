name: Quality

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject generated and hosting files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '^(acars|acars\.tests)/(bin|obj)/|^(logs|mail|etc|\.cpanel|\.caldav)/|^\.bash_history$|Zone\.Identifier$|\.(sql|sqlite|sqlite3|bak|backup)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden tracked files:"
            echo "$forbidden"
            exit 1
          fi
      - name: Validate Hermes interface JavaScript
        run: node --check acars/wwwroot/app.js

  hermes:
    name: Hermes tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore acars.tests/Promethee.Acars.Tests.csproj
      - name: Test
        run: dotnet test acars.tests/Promethee.Acars.Tests.csproj --configuration Release --no-restore --framework net8.0

  promethee:
    name: Promethee manifest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prometheus
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          extensions: json, mbstring, simplexml, bcmath, pdo, intl, zip
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
