name: Temporary SimBrief N262 verification

on:
  push:
    branches:
      - feature/simbrief-airframe-proxy-n262

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prometheus
    env:
      APP_ENV: testing
      DB_CONNECTION: memory
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: json, mbstring, simplexml, bcmath, pdo, pdo_sqlite, intl, zip
      - name: PHP syntax
        run: |
          php -l app/Models/SimBriefAirframe.php
          php -l app/Http/Controllers/Admin/AirframeController.php
          php -l modules/Promethee/Services/SimBriefAircraftProfileResolver.php
          php -l modules/Promethee/Services/SimBriefAircraftPayloadBuilder.php
          php -l modules/Promethee/Services/AircraftVariantService.php
          php -l modules/Promethee/Services/SimBriefOperationResolver.php
          php -l modules/Promethee/Http/Api/AcarsSimBriefController.php
          php -l modules/Promethee/Http/OperationsV1Controller.php
          php -l modules/Promethee/Database/migrations/2026_10_02_000023_add_simbrief_airframe_compatibility_profiles.php
          php -l tests/SimBriefAircraftPayloadBuilderTest.php
          php -l tests/SimBriefAircraftProfileResolverTest.php
          php -l tests/SimBriefOperationResolverTest.php
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run targeted SimBrief compatibility tests
        run: |
          vendor/bin/phpunit             tests/SimBriefAircraftPayloadBuilderTest.php             tests/SimBriefAircraftProfileResolverTest.php             tests/SimBriefOperationResolverTest.php
      - name: Hermès JavaScript syntax
        working-directory: .
        run: node --check acars/wwwroot/app.js
