name: One-shot rebuild Hermès 1.0.1

on:
  push:
    branches:
      - 'release/hermes-1.0.1'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: '0dd63e27c1a5adc05578516461bd00d43885a140'

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate web client
        shell: pwsh
        run: node --check acars/wwwroot/app.js

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore acars/Promethee.Acars.csproj
          dotnet build acars/Promethee.Acars.csproj -f net8.0-windows -c Release --no-restore

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: ./acars/build-installer.ps1 -Version '1.0.1'

      - name: Recreate tag and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete hermes-v1.0.1 --repo "$env:GITHUB_REPOSITORY" --yes --cleanup-tag 2>$null
          git tag hermes-v1.0.1 0dd63e27c1a5adc05578516461bd00d43885a140
          git push origin refs/tags/hermes-v1.0.1
          gh release create hermes-v1.0.1 `
            "dist/Hermes-ACARS-Setup-1.0.1.exe" `
            "dist/Hermes-ACARS-Setup-1.0.1.exe.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "hermes-v1.0.1" `
            --verify-tag `
            --generate-notes
