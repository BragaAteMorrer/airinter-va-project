name: Air Inter ID

on:
  pull_request:
    paths:
      - 'airinter-id/**'
      - '.github/workflows/airinter-id.yml'
  push:
    branches:
      - master
      - 'feature/**'
      - 'chore/**'
    paths:
      - 'airinter-id/**'
      - '.github/workflows/airinter-id.yml'

permissions:
  contents: write

jobs:
  identity:
    name: Laravel identity service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airinter-id
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, openssl
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Commit tested dependency lock once
        if: github.event_name == 'push'
        shell: bash
        working-directory: .
        run: |
          if ! git ls-files --error-unmatch airinter-id/composer.lock >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add airinter-id/composer.lock
            git commit -m "build(identity): lock tested Composer dependencies"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Check PHP syntax
        run: find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify Laravel boot and routes
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan vendor:publish --tag=passport-migrations --force
          touch database/database.sqlite
          DB_CONNECTION=sqlite DB_DATABASE=database/database.sqlite php artisan migrate --force
          php artisan passport:keys --force
          DB_CONNECTION=sqlite DB_DATABASE=database/database.sqlite php artisan airinter-id:configure-clients
          php artisan about
          php artisan route:list
      - name: Run tests
        run: php artisan test
