name: Build Hermès Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version semver, par exemple 1.1.0
        required: true
        default: 1.0.0
  push:
    tags:
      - 'hermes-v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = '${{ github.ref_name }}' -replace '^hermes-v', ''
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Version invalide: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Validate web client
        shell: pwsh
        run: node --check acars/wwwroot/app.js

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore acars/Promethee.Acars.csproj
          dotnet build acars/Promethee.Acars.csproj -f net8.0-windows -c Release --no-restore

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build portable client and installer
        shell: pwsh
        run: ./acars/build-installer.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Upload Hermès build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-ACARS-${{ steps.version.outputs.value }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/Hermes-ACARS-Setup-${{ steps.version.outputs.value }}.exe
            dist/Hermes-ACARS-Setup-${{ steps.version.outputs.value }}.exe.sha256
            dist/Promethee-ACARS-win-x64-${{ steps.version.outputs.value }}.zip
            dist/Promethee-ACARS-win-x64-${{ steps.version.outputs.value }}.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/hermes-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Hermes-ACARS-Setup-${{ steps.version.outputs.value }}.exe
            dist/Hermes-ACARS-Setup-${{ steps.version.outputs.value }}.exe.sha256
