name: Build Hermès Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version semver, par exemple 1.1.0
        required: true
        default: 1.0.0
  push:
    branches:
      - 'release/hermes-*'
    tags:
      - 'hermes-v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.Trim()
          } elseif ('${{ github.ref }}' -like 'refs/heads/release/hermes-*') {
            $version = ('${{ github.ref_name }}' -replace '^release/hermes-', '').Trim()
          } else {
            $version = ('${{ github.ref_name }}' -replace '^hermes-v', '').Trim()
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Version invalide: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Validate web client
        shell: pwsh
        run: node --check acars/wwwroot/app.js

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore acars/Promethee.Acars.csproj
          dotnet build acars/Promethee.Acars.csproj -f net8.0-windows -c Release --no-restore

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Create temporary Hermès code-signing certificate
        id: selfsign
        shell: pwsh
        run: |
          $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=Air Inter Virtual Airlines - Hermès Development Signing' `
            -FriendlyName 'Hermès temporary development signing certificate' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(2)

          $pfx = Join-Path $env:RUNNER_TEMP 'hermes-self-sign.pfx'
          $cer = Join-Path $PWD 'dist/Hermes-Development-Signing.cer'
          New-Item -ItemType Directory -Force -Path (Split-Path $cer) | Out-Null

          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null

          # The fallback certificate is intentionally self-signed. Trust it
          # only inside this ephemeral GitHub-hosted runner so signtool can
          # verify the cryptographic signature and timestamp after signing.
          # This does NOT make the certificate trusted on pilot machines.
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null

          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "password=$password" >> $env:GITHUB_OUTPUT
          Write-Host "Temporary code-signing certificate created: $($cert.Thumbprint)"
          Write-Warning "This is a SELF-SIGNED development certificate. Windows will not trust it on other PCs until the public .cer is explicitly trusted."

      - name: Build and self-sign portable client and installer
        shell: pwsh
        run: |
          ./acars/build-installer.ps1 `
            -Version '${{ steps.version.outputs.value }}' `
            -CertificatePath '${{ steps.selfsign.outputs.pfx }}' `
            -CertificatePassword '${{ steps.selfsign.outputs.password }}'

      - name: Show Authenticode signatures
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          foreach ($file in @(
            "dist/Promethee-ACARS-win-x64-$version/Promethee.Acars.exe",
            "dist/Hermes-ACARS-Setup-$version.exe"
          )) {
            $sig = Get-AuthenticodeSignature $file
            Write-Host "$file -> $($sig.Status) / $($sig.SignerCertificate.Subject)"
            if (-not $sig.SignerCertificate) { throw "Missing Authenticode signature on $file" }
          }

      - name: Upload Hermès build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-ACARS-${{ steps.version.outputs.value }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/Hermes-ACARS-Setup-${{ steps.version.outputs.value }}.exe
            dist/Hermes-ACARS-Setup-${{ steps.version.outputs.value }}.exe.sha256
            dist/Hermes-Development-Signing.cer
            dist/Promethee-ACARS-win-x64-${{ steps.version.outputs.value }}.zip
            dist/Promethee-ACARS-win-x64-${{ steps.version.outputs.value }}.zip.sha256
            dist/Hermes-Development-Signing.cer

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/hermes-v') || startsWith(github.ref, 'refs/heads/release/hermes-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hermes-v${{ steps.version.outputs.value }}
          name: Hermès ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/Hermes-ACARS-Setup-${{ steps.version.outputs.value }}.exe
            dist/Hermes-ACARS-Setup-${{ steps.version.outputs.value }}.exe.sha256
